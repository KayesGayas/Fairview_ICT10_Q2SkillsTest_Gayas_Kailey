<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Seatwork 2</title>
     <style>
        body {
             margin: 0;
             padding: 40px 20px;
             text-align: center;
             font-family: 'Segoe UI', Arial, sans-serif;
              background-image: url("https://i.pinimg.com/736x/35/81/5d/35815df7b45e0fd04b132b0dcb2678f3.jpg");
             background-size: cover;
               background-position: center;
             background-repeat: no-repeat;
              background-attachment: fixed;
             min-height: 100vh;
             color: #ffffff;
}
         .container {
              max-width: 650px;
             margin: 40px auto;
             padding: 35px;
             background: rgba(255, 255, 255, 0.18);
             backdrop-filter: blur(12px);
             border: 2px solid rgba(255, 255, 255, 0.5);
             border-radius: 25px;
             box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

         h1 {
             color: #ffffff;
             font-size: 38px;
             font-weight: bold;
             text-shadow: 2px 3px 8px #37205e;
             letter-spacing: 2px;
             margin-bottom: 15px;
} 

         p {
             color: #ffffff;
             font-size: 17px;
              text-shadow: 1px 1px 4px #37205e;
}

        input[type="text"] {
             width: 75%;
              padding: 14px;
              margin: 15px 0;
              border: 2px solid #d9c4ff;
             border-radius: 12px;
             outline: none;
             background: rgba(255, 255, 255, 0.9);
              color: #39245e;
             font-size: 16px;
             transition: 0.3s;
}

         input[type="text"]:focus {
             border-color: #a879e8;
             box-shadow: 0 0 12px #d6b5ff;
}
         button {
             padding: 13px 30px;
             margin: 10px;
             border: none;
             border-radius: 12px;
             background: linear-gradient(135deg, #a879e8, #6541a5);
             color: white;
             font-size: 16px;
             font-weight: bold;
             cursor: pointer;
             box-shadow: 0 4px 12px rgba(30, 10, 60, 0.3);
              transition: 0.3s;
}

         button:hover {
             background: linear-gradient(135deg, #c49cf5, #8156c4);
             transform: translateY(-3px);
             box-shadow: 0 6px 16px rgba(30, 10, 60, 0.4);
}

         .result {
             margin-top: 30px;
             padding: 20px;
             background: rgba(255, 255, 255, 0.2);
             border: 2px solid rgba(255, 255, 255, 0.6);
             border-radius: 18px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

         .result h3 {
             color: #ffffff;
             font-size: 24px;
             text-shadow: 1px 2px 5px #39245e;
              margin-bottom: 20px;
}

        .result p {
             padding: 10px;
             margin: 10px 0;
             background: rgba(255, 255, 255, 0.18);
             border-radius: 10px;
             text-align: left;
             font-size: 17px;
}

         .result b {
             color: #f0ddff;
}

         .result span {
              color: #ffffff;
             margin-left: 8px;
             font-weight: bold;
}        

         @media (max-width: 600px) {
        .container {
             padding: 20px;
             margin: 15px auto;
    }

         h1 {
             font-size: 28px;
    }

         input[type="text"] {
              width: 85%;
    }
}
    </style>

</head> 
<body>
    <div class="container">
    <h1>Non-Metal Element</h1>
    <p>Enter a element symbol to search</p>

    <input type="text" id="element1" placeholder="EXAMPLE: Helium">

    <br>
    <button py-click="search_element"> Search Element</button>
    <div class="result">
         <h3>Search result</h3>
         <p><b>Element Symbol:</b><span id="symbol"></span></p>
         <p><b>Element Name:</b><span id="name"></span></p>
         <p><b>Atomic Number:</b><span id="number"></span></p>
         <p><b>Atomic Mass:</b><span id="mass"></span></p>


    </div>

    <py-script src="main.py"></py-script>
    </div>
</body>
</html>
